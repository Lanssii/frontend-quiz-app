<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/output.css" />
  </head>
  <body
    class="flex flex-col justify-center items-center min-h-screen bg-gradient-to-r from-cyan-300 to-blue-600 font-sans selection:bg-cyan-200 px-4"
  >
    <h1 class="text-4xl font-extrabold mb-4 text-white drop-shadow-md">
      Frontend Quiz
    </h1>

    <div
      class="quiz-container w-full max-w-xl bg-white/10 backdrop-blur-md border-2 border-white/20 rounded-2xl p-8 md:p-10 shadow-2xl"
    >
      <div class="flex items-start justify-between gap-4 mb-6">
        <h3 class="question text-xl md:text-2xl font-bold text-white"></h3>

        <p
          class="counter text-white text-sm md:text-base whitespace-nowrap shrink-0"
        ></p>
      </div>

      <ul
        class="answers-container flex flex-col gap-3 text-lg font-medium text-white"
      ></ul>
      <div class="flex justify-end">
        <button
          type="button"
          aria-label="next question"
          class="next-btn text-white text-2xl cursor-pointer hover:scale-150 transition-all"
        >
          &rarr;
        </button>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
