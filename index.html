<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/output.css" />
  </head>
  <body
    class="flex flex-col justify-center items-center min-h-screen bg-gradient-to-r from-cyan-300 to-blue-600 font-sans selection:bg-cyan-200"
  >
    <h1 class="text-4xl font-extrabold mb-4 text-white drop-shadow-md">
      Frontend Quiz
    </h1>
    <div
      class="quiz-container w-full max-w-xl bg-white/10 backdrop-blur-md border-2 border-white/20 rounded-2xl p-8 md:p-10 shadow-2xl"
    >
      <h3 class="question text-2xl font-bold mb-6 text-white">
        What does HTML stand for?
      </h3>
      <ul class="flex flex-col gap-3 text-lg font-medium text-white">
        <li
          class="cursor-pointer bg-white/5 hover:bg-white/20 border-white/10 hover:border-white/40 rounded-xl px-5 py-3.5 transition-all duration-200 active:scale-[0.99]"
        >
          Hyper Text Markup Language
        </li>
        <li
          class="cursor-pointer bg-white/5 hover:bg-white/20 border-white/10 hover:border-white/40 rounded-xl px-5 py-3.5 transition-all duration-200 active:scale-[0.99]"
        >
          Home Tool Markup Language
        </li>
        <li
          class="cursor-pointer bg-white/5 hover:bg-white/20 border-white/10 hover:border-white/40 rounded-xl px-5 py-3.5 transition-all duration-200 active:scale-[0.99]"
        >
          Hyperlinks and Text Markup Language
        </li>
        <li
          class="cursor-pointer bg-white/5 hover:bg-white/20 border-white/10 hover:border-white/40 rounded-xl px-5 py-3.5 transition-all duration-200 active:scale-[0.99]"
        >
          Hyper Tool Multi Language
        </li>
      </ul>
    </div>
  </body>
  <script src="script.js"></script>
</html>
